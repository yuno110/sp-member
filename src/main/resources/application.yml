spring:
  application:
    name: member-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sp_member?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 비밀 값은 기본값을 두지 않는다. 없으면 기동이 실패한다 (sp-docs/tech-stack.md §4.3)
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8081

# 서비스 간 내부 API 인증 키 (sp-docs/security.md §6).
# 비밀 값이므로 기본값을 두지 않는다. board 와 같은 값이어야 한다.
member-service:
  internal-api-key: ${INTERNAL_API_KEY}

# auth-service 가 발급한 토큰을 공개키로 검증만 한다.
# 개인키는 이 서비스에 없다 (sp-docs/security.md §2).
jwt:
  public-key-location: classpath:jwt-public.pem
